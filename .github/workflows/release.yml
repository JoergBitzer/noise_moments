# Builds the two plugins of this repository (MomentNoise, AmplitudeHistogram) for Windows, macOS
# and Linux (AAT2 template, see README); one zip per system holds both plugins.
#  - push a tag vX.Y.Z (must match the VERSION in CMakeLists.txt and in both plugin folders):
#    builds all platforms and creates a GitHub Release with the zips
#  - "Run workflow" button on the Actions page: builds only, the zips are
#    attached to the workflow run (no release)
name: Build and release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  PACKAGE: NoiseMoments                      # name of the zips
  PLUGINS: MomentNoise AmplitudeHistogram    # one folder per plugin, artefacts in build/<plugin>/<plugin>_artefacts
  # put into every zip next to the plugins (the manuals, <plugin>/docs/manual/*.pdf, are added if they exist)
  DOCS: release/ReadMeFirst.txt LICENSE LICENSE-AGPL-3.0.txt

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            targets: MomentNoise_VST3 MomentNoise_Standalone AmplitudeHistogram_VST3 AmplitudeHistogram_Standalone
            cmake_args: ''
          - name: macOS
            os: macos-latest
            targets: >-
              MomentNoise_VST3 MomentNoise_AU MomentNoise_Standalone
              AmplitudeHistogram_VST3 AmplitudeHistogram_AU AmplitudeHistogram_Standalone
            # one Universal binary for Apple Silicon and Intel
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          - name: Linux
            # older Ubuntu = older glibc, so the binaries also run on older distributions
            os: ubuntu-22.04
            targets: MomentNoise_VST3 MomentNoise_Standalone AmplitudeHistogram_VST3 AmplitudeHistogram_Standalone
            cmake_args: ''

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target ${{ matrix.targets }}

      # pluginval (see tools/run_pluginval.*): a failing plugin stops the release.
      # Linux: in the job test-linux below (pluginval 2.x needs glibc 2.38, ubuntu-22.04 has 2.35)
      - name: Test with pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          for plugin in $PLUGINS; do
            $plugin/tools/run_pluginval.sh "build/$plugin/${plugin}_artefacts/Release/VST3/$plugin.vst3" 1
          done

      # auval: Apple's Audio Unit validation (what Logic/GarageBand check before loading an AU).
      # The AU codes (type, subtype, manufacturer) are read from the built component.
      - name: Test the AU with auval (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          for plugin in $PLUGINS; do
            cp -R "build/$plugin/${plugin}_artefacts/Release/AU/$plugin.component" ~/Library/Audio/Plug-Ins/Components/
          done
          killall -9 AudioComponentRegistrar 2>/dev/null || true # make macOS find the new AUs
          for plugin in $PLUGINS; do
            component=~/Library/Audio/Plug-Ins/Components/$plugin.component
            codes=""
            for key in type subtype manufacturer; do
              codes="$codes $(plutil -extract AudioComponents.0.$key raw "$component/Contents/Info.plist")"
            done
            echo "$plugin AU codes:$codes"
            auval -strict -v $codes | tee auval.log
            grep -q "AU VALIDATION SUCCEEDED" auval.log
          done

      - name: Test with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($plugin in $env:PLUGINS.Split(' ')) {
            & "$plugin/tools/run_pluginval.ps1" "build/$plugin/${plugin}_artefacts/Release/VST3/$plugin.vst3" 1
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/$PACKAGE
          for plugin in $PLUGINS; do
            artefacts=build/$plugin/${plugin}_artefacts/Release
            cp -r "$artefacts/VST3/$plugin.vst3" "$artefacts/Standalone/$plugin.exe" dist/$PACKAGE/
            cp $plugin/docs/manual/*.pdf dist/$PACKAGE/ 2>/dev/null || true
          done
          cp $DOCS dist/$PACKAGE/
          cd dist && 7z a ../$PACKAGE-Windows.zip $PACKAGE

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/$PACKAGE
          for plugin in $PLUGINS; do
            artefacts=build/$plugin/${plugin}_artefacts/Release
            cp -R "$artefacts/VST3/$plugin.vst3" "$artefacts/AU/$plugin.component" "$artefacts/Standalone/$plugin.app" dist/$PACKAGE/
            cp $plugin/docs/manual/*.pdf dist/$PACKAGE/ 2>/dev/null || true
          done
          # not signed with a Developer ID yet: ad-hoc signature, so the arm64 code is allowed to run at all
          for bundle in dist/$PACKAGE/*.vst3 dist/$PACKAGE/*.component dist/$PACKAGE/*.app; do codesign --force --deep --sign - "$bundle"; done
          cp $DOCS dist/$PACKAGE/
          ditto -c -k --keepParent dist/$PACKAGE $PACKAGE-macOS.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/$PACKAGE
          for plugin in $PLUGINS; do
            artefacts=build/$plugin/${plugin}_artefacts/Release
            cp -r "$artefacts/VST3/$plugin.vst3" "$artefacts/Standalone/$plugin" dist/$PACKAGE/
            cp $plugin/docs/manual/*.pdf dist/$PACKAGE/ 2>/dev/null || true
          done
          cp $DOCS dist/$PACKAGE/
          cd dist && zip -r ../$PACKAGE-Linux.zip $PACKAGE

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}-${{ matrix.name }}
          path: ${{ env.PACKAGE }}-${{ matrix.name }}.zip

  # The Linux build runs on ubuntu-22.04 (old glibc: the plugin also runs on older distributions), but
  # pluginval 2.0.0-beta3 needs glibc 2.38: so the Linux zip is tested here, on a newer Ubuntu.
  test-linux:
    name: Test Linux (pluginval)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # for tools/run_pluginval.sh

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libfreetype6 libfontconfig1 \
            libx11-6 libxext6 libxinerama1 libxrandr2 libxcursor1 libxcomposite1 libgl1 xvfb

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE }}-Linux

      - name: Test with pluginval
        run: |
          # into its own folder: the repository may have a source folder with the product name
          unzip -q "$PACKAGE-Linux.zip" -d downloaded
          for plugin in $PLUGINS; do
            xvfb-run -a $plugin/tools/run_pluginval.sh "downloaded/$PACKAGE/$plugin.vst3" 1
          done

  release:
    name: Create release
    needs: [build, test-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the versions (repository and both plugins)
        run: |
          version=$(sed -n 's/^project(NoiseMoments VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          echo "tag ${GITHUB_REF_NAME}, CMakeLists version ${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          for plugin in $PLUGINS; do
            pluginVersion=$(sed -n 's/^project(${TARGET_NAME} VERSION \([0-9.]*\)).*/\1/p' $plugin/CMakeLists.txt)
            echo "$plugin version ${pluginVersion}"
            test "${pluginVersion}" = "${version}"
          done

      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Downloads for Windows, macOS (Universal: Apple Silicon and Intel) and Linux.
          Each zip contains both plugins, MomentNoise (noise with adjustable skewness and excess kurtosis)
          and AmplitudeHistogram (histogram of the input amplitudes), as VST3 and Standalone application
          (macOS also as AU), the manuals, a ReadMeFirst.txt and the license files (source code: MIT; binaries: AGPLv3, because of JUCE).

          **Installation:** copy the plugin into the standard folder of your system
          (Windows: `C:\Program Files\Common Files\VST3`, macOS: `~/Library/Audio/Plug-Ins/VST3` and
          `~/Library/Audio/Plug-Ins/Components`, Linux: `~/.vst3`).

          **macOS:** the binaries are not signed with an Apple Developer ID yet. If macOS says the
          plugin is damaged or cannot be opened, remove the quarantine flag in the Terminal, e.g.
          `xattr -cr ~/Library/Audio/Plug-Ins/VST3/MomentNoise.vst3`.
          EOF
          gh release create "$GITHUB_REF_NAME" zips/*.zip --title "$PACKAGE $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes
